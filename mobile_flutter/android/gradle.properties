# Trimmed from -Xmx8G/-XX:MaxMetaspaceSize=4G: on this machine the Gradle
# daemon was repeatedly crashing ("daemon disappeared unexpectedly" + a JVM
# hs_err_pid crash log) every time it started, both for `gradlew signingReport`
# and for `flutter run`'s assembleDebug. With the Android emulator + Android
# Studio + this daemon all fighting for RAM on a ~16 GB machine, an 8 GB
# daemon heap request left too little headroom and the JVM died on native
# allocation. Also adds --enable-native-access=ALL-UNNAMED: recent JDK 21
# builds (this project runs on Android Studio's bundled JBR 21) restrict
# native calls by default, and Gradle's native-platform library (used for
# file-system watching) hits that restriction — the terminal warning
# ("Use --enable-native-access=ALL-UNNAMED to avoid a warning") was the
# tell. org.gradle.vfs.watch=false disables that same native file-watcher
# outright, since it's the most common source of these native crashes on
# Windows and isn't needed for a single-developer build loop.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
