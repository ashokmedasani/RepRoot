<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Studio mobile — Plan 2: sharp / corporate</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --accent: #185FA5;
    --bg-page: #eceae2;
    --surface: #f1efe8;
    --card: #ffffff;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #d3d1c7;
    --border-strong: #b4b2a9;
    --disabled-bg: #eceae2;
    --disabled-text: #b4b2a9;
    --r-btn: 4px;
    --r-card: 6px;
    --r-chip: 4px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-page);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 2rem 1rem;
  }
  h1 { font-size: 18px; font-weight: 500; text-align: center; color: var(--text-primary); margin: 0 0 4px; }
  p.sub { font-size: 13px; text-align: center; color: var(--text-secondary); margin: 0 0 1.5rem; }
  .phone {
    width: 375px;
    margin: 0 auto;
    background: var(--surface);
    border: 8px solid #1c1c1c;
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-primary); padding: 6px 12px 2px; font-weight: 500; }
  .screen { background: var(--surface); border-radius: 8px; padding: 16px 14px 90px; min-height: 600px; position: relative; overflow: hidden; }
  .screen-title { font-size: 20px; font-weight: 500; color: var(--text-primary); margin: 4px 0 14px; border-bottom: 2px solid var(--text-primary); padding-bottom: 10px; }
  .chip-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .chip { padding: 6px 14px; border-radius: var(--r-chip); font-size: 13px; border: 1px solid var(--border-strong); background: var(--card); color: var(--text-secondary); }
  .chip.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
  .card { background: var(--card); border-radius: var(--r-card); padding: 14px; margin-bottom: 10px; border: 1px solid var(--border-strong); }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-size: 14px; font-weight: 500; color: var(--text-primary); margin: 0 0 2px; }
  .card-sub { font-size: 12px; color: var(--text-muted); margin: 0; }
  .btn-card-action { border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: var(--r-btn); }
  .section-label { font-size: 12px; color: var(--text-muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; border-top: 1px solid var(--border); padding-top: 12px; }
  .gallery { display: flex; flex-direction: column; gap: 10px; }
  .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: var(--r-btn); height: 40px; font-size: 14px; font-weight: 500; }
  .btn-secondary { background: transparent; border: 1.5px solid var(--text-primary); border-radius: var(--r-btn); height: 40px; font-size: 14px; color: var(--text-primary); }
  .btn-text { background: transparent; border: none; border-bottom: 1px solid var(--accent); color: var(--accent); font-size: 14px; height: 30px; text-align: left; padding: 0; width: fit-content; }
  .btn-disabled { background: var(--disabled-bg); color: var(--disabled-text); border: 1px solid var(--border); border-radius: var(--r-btn); height: 40px; font-size: 14px; }
  .row-icon-seg { display: flex; align-items: center; gap: 10px; }
  .btn-icon { width: 40px; height: 40px; border-radius: var(--r-btn); background: var(--accent); color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .segmented { display: flex; background: var(--card); border: 1px solid var(--text-primary); border-radius: var(--r-btn); flex: 1; }
  .segmented button { flex: 1; border: none; background: transparent; height: 36px; font-size: 12px; color: var(--text-secondary); border-right: 1px solid var(--border-strong); }
  .segmented button:last-child { border-right: none; }
  .segmented button.active { background: var(--text-primary); color: #fff; }
  .fab { position: absolute; bottom: 74px; right: 18px; width: 48px; height: 48px; border-radius: 8px; background: var(--accent); color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--border-strong); display: flex; justify-content: space-around; padding: 8px 4px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--text-muted); background: none; border: none; }
  .tab.active { color: var(--accent); border-top: 2px solid var(--accent); margin-top: -2px; padding-top: 2px; }
  .tab i { font-size: 20px; }
</style>
</head>
<body>
<h1>Plan 2 — sharp / corporate</h1>
<p class="sub">Square-cornered buttons, bordered controls, flat full-width tab bar with top-border indicator</p>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>Studio</span></div>
  <div class="screen">
    <p class="screen-title">Dashboard</p>
    <div class="chip-row">
      <button class="chip active">All</button>
      <button class="chip">Active</button>
      <button class="chip">Pending</button>
    </div>
    <div class="card">
      <div class="card-row">
        <div>
          <p class="card-title">Ava Martinez</p>
          <p class="card-sub">Next session · Tomorrow, 10:00 AM</p>
        </div>
        <button class="btn-card-action">View</button>
      </div>
    </div>
    <div class="card">
      <div class="card-row">
        <div>
          <p class="card-title">Nolan Reyes</p>
          <p class="card-sub">Payment due · $120</p>
        </div>
        <button class="btn-card-action">View</button>
      </div>
    </div>

    <p class="section-label">Button gallery</p>
    <div class="gallery">
      <button class="btn-primary">Sign in</button>
      <button class="btn-secondary">Create account</button>
      <button class="btn-text">Forgot password</button>
      <div class="row-icon-seg">
        <button class="btn-icon" aria-label="Add"><i class="ti ti-plus" aria-hidden="true"></i></button>
        <div class="segmented">
          <button class="active">Weekly</button>
          <button>Monthly</button>
        </div>
      </div>
      <button class="btn-disabled" disabled>Continue</button>
    </div>

    <button class="fab" aria-label="Add new"><i class="ti ti-plus" aria-hidden="true"></i></button>
    <div class="tabbar">
      <button class="tab active"><i class="ti ti-home" aria-hidden="true"></i>Home</button>
      <button class="tab"><i class="ti ti-users" aria-hidden="true"></i>Clients</button>
      <button class="tab"><i class="ti ti-calendar" aria-hidden="true"></i>Schedule</button>
      <button class="tab"><i class="ti ti-credit-card" aria-hidden="true"></i>Payments</button>
      <button class="tab"><i class="ti ti-user" aria-hidden="true"></i>Profile</button>
    </div>
  </div>
</div>
</body>
</html>
