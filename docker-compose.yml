services:
  postgres:
    image: postgres:16
    container_name: trainer-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trainer_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trainer_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
