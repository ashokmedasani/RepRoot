<main class="auth-page">
  <header class="auth-topbar">
    <a routerLink="/portal" class="brand">CoachFlow Studio</a>
    <div class="top-action">
      <span>Already have an account?</span>
      <a routerLink="/trainer/login">Login</a>
    </div>
  </header>

  <section class="auth-card" aria-labelledby="trainer-signup-title">
    <h1 id="trainer-signup-title">Create your account</h1>

    <form class="auth-form" (ngSubmit)="createTrainerAccount()">
      <label class="wide-field">
        <span class="field-label">Username <span class="required">*</span></span>
        <span class="input-with-button">
          <input name="username" type="text" [(ngModel)]="signupForm.username" (ngModelChange)="handleUsernameChange()" autocomplete="username" required>
          <button type="button" [disabled]="isCheckingUsername" [class.success-button]="usernameStatus === 'available'" [class.error-button]="usernameStatus === 'taken' || usernameStatus === 'failed'" (click)="verifyUsername()">Verify</button>
        </span>
        @if (usernameCheckMessage) {
          <span class="field-help" [class.success-text]="usernameStatus === 'available'" [class.error-text]="usernameStatus === 'taken' || usernameStatus === 'failed'">
            {{ usernameCheckMessage }}
          </span>
        }
        @if (fieldErrors.username) {
          <span class="field-help error-text">{{ fieldErrors.username }}</span>
        }
      </label>

      <label class="wide-field">
        <span class="field-label">Email ID <span class="required">*</span></span>
        <span class="input-with-button">
          <input name="email" type="email" [(ngModel)]="signupForm.email" (ngModelChange)="handleEmailChange()" autocomplete="email" [readonly]="emailOtpStatus === 'verified'" required>
          <button type="button" [disabled]="!canSendOtp" (click)="requestEmailOtp()">{{ sendOtpButtonText }}</button>
        </span>
        @if (isEmailAlreadyRegistered) {
          <span class="field-help error-text">
            Email exists already. Try <a routerLink="/trainer/login">Login</a> or <a routerLink="/trainer/forgot-password">Forgot Password</a>.
          </span>
        } @else if (emailOtpHelpText) {
          <span class="field-help" [class.success-text]="emailOtpStatus === 'verified'" [class.error-text]="emailOtpStatus === 'failed'">
            {{ emailOtpHelpText }}
          </span>
        } @else if (emailCheckMessage) {
          <span class="field-help">{{ emailCheckMessage }}</span>
        }
        @if (fieldErrors.email && !isEmailAlreadyRegistered) {
          <span class="field-help error-text">{{ fieldErrors.email }}</span>
        }
        @if (emailOtpStatus === 'sent') {
          <span class="field-help">
            If not received,
            @if (resendCountdown > 0) {
              <span>resend OTP enables in {{ resendCountdown }}s.</span>
            } @else {
              <button type="button" class="text-link" [disabled]="!canResendOtp" (click)="requestEmailOtp(true)">resend OTP</button>
            }
          </span>
        }
        @if (localDebugOtp) {
          <span class="field-help success-text">Local test OTP: {{ localDebugOtp }}</span>
        }
      </label>

      <label class="wide-field">
        <span class="field-label">OTP <span class="required">*</span></span>
        <span class="input-with-button">
          <input name="emailOtp" type="text" inputmode="numeric" maxlength="6" [(ngModel)]="signupForm.emailOtp" (ngModelChange)="handleOtpChange()" required>
          <button type="button" [disabled]="!canVerifyOtp" [class.success-button]="emailOtpStatus === 'verified'" [class.error-button]="emailOtpStatus === 'failed'" (click)="verifyEmailOtp()">{{ verifyOtpButtonText }}</button>
        </span>
        @if (fieldErrors.otp) {
          <span class="field-help error-text">{{ fieldErrors.otp }}</span>
        }
      </label>

      <label class="wide-field">
        <span class="field-label">Password <span class="required">*</span></span>
        <app-password-input name="password" [(ngModel)]="signupForm.password" (ngModelChange)="handlePasswordChange()" autocomplete="new-password" [required]="true" />
        <span class="field-help">Minimum 8 characters and 1 special character.</span>
        @if (fieldErrors.password) {
          <span class="field-help error-text">{{ fieldErrors.password }}</span>
        }
      </label>

      <label class="wide-field">
        <span class="field-label">Confirm Password <span class="required">*</span></span>
        <app-password-input name="confirmPassword" [(ngModel)]="signupForm.confirmPassword" (ngModelChange)="handleConfirmPasswordChange()" autocomplete="new-password" [required]="true" />
        @if (fieldErrors.confirmPassword) {
          <span class="field-help error-text">{{ fieldErrors.confirmPassword }}</span>
        }
      </label>

      <label class="agree-field wide-field">
        <input type="checkbox" name="agreeTerms" [(ngModel)]="agreedToTerms">
        <span>
          I agree to the
          <a routerLink="/terms" target="_blank" rel="noopener">Terms &amp; Conditions</a>
          and
          <a routerLink="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.
        </span>
      </label>

      <button type="submit" class="primary-action wide-field" [disabled]="isSubmitting || !agreedToTerms">Create Account</button>

      @if (signupMessage) {
        <p class="form-message wide-field">{{ signupMessage }}</p>
      }

      @if (fieldErrors.general) {
        <p class="form-message error-message wide-field">{{ fieldErrors.general }}</p>
      }
    </form>
  </section>
</main>
