<main class="auth-page">
  <header class="auth-topbar">
    <a routerLink="/portal" class="brand">CoachFlow Studio</a>
    <div class="top-action">
      <span>New to CoachFlow?</span>
      <a routerLink="/trainer/signup">Sign up</a>
    </div>
  </header>

  <section class="auth-card" aria-labelledby="trainer-login-title">
    <p class="eyebrow">Trainer portal</p>
    <h1 id="trainer-login-title">Login to CoachFlow</h1>

    @if (loginNotice) {
      <p class="form-message top-message">{{ loginNotice }}</p>
    }

    <form class="auth-form" (ngSubmit)="verifyTrainerLogin()">
      <label>
        <span class="field-label">Email or Username <span class="required">*</span></span>
        <input name="identifier" type="text" [(ngModel)]="loginForm.identifier" autocomplete="username" required>
      </label>

      <label>
        <span class="field-label">Password <span class="required">*</span></span>
        <app-password-input name="loginPassword" [(ngModel)]="loginForm.password" autocomplete="current-password" [required]="true" />
      </label>

      <a routerLink="/trainer/forgot-password" class="forgot-link">Forgot password?</a>

      <button type="submit" class="primary-action" [disabled]="isSubmitting">Continue</button>

      @if (loginMessage) {
        <p class="form-message">{{ loginMessage }}</p>
      }
    </form>
  </section>
</main>
