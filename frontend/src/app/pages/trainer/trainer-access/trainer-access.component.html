<main class="trainer-access-shell">
  <a routerLink="/portal" class="back-link">Back</a>

  <header class="trainer-access-header">
    <p class="eyebrow">Trainer Access</p>
    <h1>Choose Login or Signup</h1>
    <p>Use an existing trainer account or create a new global trainer profile.</p>
  </header>

  <section class="choice-grid" aria-label="Trainer account choices">
    <a routerLink="/trainer/login" class="choice-card">
      <span class="choice-card__icon">L</span>
      <strong>Login</strong>
      <small>Enter username or email and password.</small>
    </a>

    <a routerLink="/trainer/signup" class="choice-card">
      <span class="choice-card__icon">S</span>
      <strong>Signup</strong>
      <small>Create a trainer account with required profile details.</small>
    </a>
  </section>
</main>
