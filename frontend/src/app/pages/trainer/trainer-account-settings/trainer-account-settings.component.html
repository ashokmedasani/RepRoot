<app-trainer-page-shell
  title="Settings"
  eyebrow="Settings"
  activeSection="settings"
  maxWidth="72rem"
  titleId="account-settings-title"
>
    <div class="settings-grid">
      <section class="settings-panel account-panel">
        <div class="settings-menu" aria-label="Settings sections">
          <button type="button" class="settings-tab active">Account</button>
        </div>

        <div class="account-content">
          <section class="account-section" aria-labelledby="trainer-code-title">
            <div>
              <h2 id="trainer-code-title">Trainer Code</h2>
              <p class="section-note">Clients log in with this code plus their username and password. Share it with your clients.</p>
            </div>

            <form class="code-form" (ngSubmit)="saveTrainerCode()">
              <label>
                <span class="field-label">Your trainer code</span>
                <input type="text" name="trainerCode" [(ngModel)]="codeDraft" placeholder="e.g. FITJOHN" autocomplete="off">
              </label>
              <button type="submit" class="primary-action" [disabled]="isSavingCode">
                {{ isSavingCode ? 'Saving...' : 'Save Code' }}
              </button>
            </form>
            @if (codeMessage) {
              <p class="account-message" [class.error-message]="codeMessageType === 'error'">{{ codeMessage }}</p>
            }
          </section>

          <section class="account-section" aria-labelledby="change-password-title">
            <div>
              <h2 id="change-password-title">Change Password</h2>
            </div>

            <form class="password-form" (ngSubmit)="changePassword()">
              <label>
                <span class="field-label">Password</span>
                <app-password-input name="password" autocomplete="new-password" [(ngModel)]="passwordForm.password" />
              </label>
              <label>
                <span class="field-label">Confirm Password</span>
                <app-password-input name="confirmPassword" autocomplete="new-password" [(ngModel)]="passwordForm.confirmPassword" />
              </label>
              <button type="submit" class="primary-action" [disabled]="isChangingPassword">
                {{ isChangingPassword ? 'Changing...' : 'Change password' }}
              </button>
            </form>
          </section>
        </div>
      </section>

      @if (accountMessage) {
        <p class="message" [class.error-message]="accountMessageType === 'error'">{{ accountMessage }}</p>
      }
    </div>
</app-trainer-page-shell>
