<app-trainer-page-shell
  title="Create your trainer lead form"
  eyebrow="Step 1"
  activeSection="forms-groups"
  maxWidth="72rem"
  titleId="lead-form-title"
>
    <a page-actions class="ghost-link" routerLink="/trainer/forms-groups">Back to dashboard</a>

    @if (isLoading) {
      <p class="message">Loading form builder...</p>
    } @else {
      <section class="setup-card">
        <label>
          <span class="field-label">Form name</span>
          <input type="text" [(ngModel)]="title" name="leadFormTitle">
        </label>
      </section>

      <section class="setup-card">
        <app-form-field-builder [customFields]="customFields"></app-form-field-builder>
      </section>

      @if (message) {
        <p class="message" [class.error-message]="messageType === 'error'">{{ message }}</p>
      }

      <div class="action-bar">
        <button type="button" class="primary-action" [disabled]="isSaving" (click)="saveForm()">
          {{ isSaving ? 'Saving...' : 'Save and continue' }}
        </button>
      </div>
    }
</app-trainer-page-shell>
