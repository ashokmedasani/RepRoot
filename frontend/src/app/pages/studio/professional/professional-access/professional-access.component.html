<main class="professional-access-shell">
  <a routerLink="/portal" class="back-link">Back</a>

  <header class="professional-access-header">
    <p class="eyebrow">Professional Access</p>
    <h1>Choose Login or Signup</h1>
    <p>Use an existing professional account or create a new global professional profile.</p>
  </header>

  <section class="choice-grid" aria-label="Professional account choices">
    <a routerLink="/professional/login" class="choice-card">
      <span class="choice-card__icon">L</span>
      <strong>Login</strong>
      <small>Enter username or email and password.</small>
    </a>

    <a routerLink="/professional/signup" class="choice-card">
      <span class="choice-card__icon">S</span>
      <strong>Signup</strong>
      <small>Create a professional account with required profile details.</small>
    </a>
  </section>
</main>
