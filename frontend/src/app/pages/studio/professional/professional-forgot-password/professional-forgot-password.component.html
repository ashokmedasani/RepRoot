<app-auth-page-shell
  actionLabel="Remembered it?"
  actionLinkText="Login"
  actionLink="/professional/login"
  eyebrow="Professional security"
  title="Reset your password"
  subtitle="Complete email verification before choosing a new password."
  audience="professional"
  titleId="forgot-password-title">

  <ol class="recovery-steps" aria-label="Password recovery progress">
    <li class="active" [class.complete]="resetOtpStatus !== 'idle'"><span>1</span><small>Email</small></li>
    <li [class.active]="resetOtpStatus === 'sent' || resetOtpStatus === 'failed'" [class.complete]="resetOtpStatus === 'verified'"><span>2</span><small>Verify OTP</small></li>
    <li [class.active]="resetOtpStatus === 'verified'"><span>3</span><small>New password</small></li>
  </ol>

  <form class="auth-form" (ngSubmit)="resetPassword()">
    <label>
      <span class="field-label">Email ID <span class="required">*</span></span>
      <span class="input-with-button">
        <input name="email" type="email" [(ngModel)]="resetForm.email" autocomplete="email" [readonly]="resetOtpStatus === 'verified'" required>
        <button type="button" [disabled]="!canSendOtp" (click)="requestOtp()">{{ sendOtpButtonText }}</button>
      </span>
      @if (resetFieldErrors.email) {
        <span class="field-help error-text">{{ resetFieldErrors.email }}</span>
      }
      @if (isEmailMissing) {
        <span class="field-help error-text">
          No professional account found. Try <a routerLink="/professional/signup">Sign up</a> or <a routerLink="/professional/login">Login</a>.
        </span>
      } @else if (resetOtpHelpText) {
        <span class="field-help" [class.success-text]="resetOtpStatus === 'verified'" [class.error-text]="resetOtpStatus === 'failed'">
          {{ resetOtpHelpText }}
        </span>
      } @else if (resetOtpMessage) {
        <span class="field-help">{{ resetOtpMessage }}</span>
      }
      @if (resetOtpStatus === 'sent') {
        <span class="field-help">
          If not received,
          @if (resendCountdown > 0) {
            <span>resend OTP enables in {{ resendCountdown }}s.</span>
          } @else {
            <button type="button" class="text-link" [disabled]="!canResendOtp" (click)="requestOtp(true)">resend OTP</button>
          }
        </span>
      }
    </label>

    @if (resetOtpStatus === 'sent' || resetOtpStatus === 'failed' || resetOtpStatus === 'verified') {
    <label>
      <span class="field-label">OTP <span class="required">*</span></span>
      <span class="input-with-button">
        <input class="otp-code" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" [(ngModel)]="resetForm.otp" (ngModelChange)="handleResetOtpChange()" required>
        <button type="button" [disabled]="!canVerifyOtp" [class.success-button]="resetOtpStatus === 'verified'" [class.error-button]="resetOtpStatus === 'failed'" (click)="verifyOtp()">{{ verifyOtpButtonText }}</button>
      </span>
      @if (resetFieldErrors.otp) {
        <span class="field-help error-text">{{ resetFieldErrors.otp }}</span>
      }
    </label>
    }

    @if (resetOtpStatus === 'verified') {
    <label>
      <span class="field-label">New Password <span class="required">*</span></span>
      <app-password-input name="password" [(ngModel)]="resetForm.password" (ngModelChange)="handleResetPasswordChange()" autocomplete="new-password" [required]="true" />
      <app-password-requirements [password]="resetForm.password" />
      @if (resetFieldErrors.password) {
        <span class="field-help error-text">{{ resetFieldErrors.password }}</span>
      }
    </label>

    <label>
      <span class="field-label">Confirm Password <span class="required">*</span></span>
      <app-password-input name="confirmPassword" [(ngModel)]="resetForm.confirmPassword" (ngModelChange)="handleResetConfirmPasswordChange()" autocomplete="new-password" [required]="true" />
      @if (resetFieldErrors.confirmPassword) {
        <span class="field-help error-text">{{ resetFieldErrors.confirmPassword }}</span>
      }
    </label>

    <button type="submit" class="primary-action" [disabled]="isResettingPassword || !isResetPasswordRequirementsMet || resetForm.password !== resetForm.confirmPassword">Reset Password</button>
    }

    @if (resetMessage) {
      <p class="form-message">{{ resetMessage }}</p>
    }

    @if (resetFieldErrors.general) {
      <p class="form-message error-message">{{ resetFieldErrors.general }}</p>
    }
  </form>
</app-auth-page-shell>
