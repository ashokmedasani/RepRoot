<app-professional-page-shell
  title="Create the client creation form"
  eyebrow="Step 3"
  subtitle="Choose the registration information collected for clients joining this group."
  activeSection="forms-groups"
  titleId="client-form-title"
>
    <a page-actions class="secondary-action" routerLink="/professional/forms-groups">Back to Forms &amp; Groups</a>

    @if (isLoading) {
      <p class="message">Loading client form builder...</p>
    } @else if (group) {
      <section class="setup-card group-context">
        <span>Group</span>
        <h2>{{ group.name }}</h2>
        @if (group.description) {
          <p>{{ group.description }}</p>
        }
      </section>

      <section class="setup-card">
        <label class="toggle-row">
          <input type="checkbox" [(ngModel)]="isMandatory" name="registrationFormMandatory">
          <span>Require this form to be completed before a client can be added to this group</span>
        </label>
      </section>

      <section class="setup-card">
        <app-form-field-builder [customFields]="customFields" [externalSuggestionGroups]="externalSuggestionGroups"></app-form-field-builder>
      </section>

      @if (message) {
        <p class="message" [class.error-message]="messageType === 'error'">{{ message }}</p>
      }

      <div class="action-bar">
        <button type="button" class="primary-action" [disabled]="isSaving" (click)="saveForm()">
          {{ isSaving ? 'Saving...' : 'Save client creation form' }}
        </button>
      </div>
    } @else if (message) {
      <p class="message error-message">{{ message }}</p>
    }
</app-professional-page-shell>
