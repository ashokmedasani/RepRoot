<div class="password-field">
  <input
    [id]="inputId || null"
    [type]="isVisible ? 'text' : 'password'"
    [value]="value"
    [placeholder]="placeholder"
    [attr.autocomplete]="autocomplete"
    [required]="required"
    [disabled]="isDisabled"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  >
  <button
    type="button"
    class="toggle-visibility"
    [attr.aria-label]="isVisible ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="isVisible"
    (click)="toggleVisibility()"
  >
    @if (isVisible) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3l18 18"/>
        <path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c5 0 8.6 3.6 10 7-.5 1.2-1.3 2.5-2.4 3.6M6.3 6.5C4.4 7.8 3 9.6 2 12c1.4 3.4 5 7 10 7 1.6 0 3.1-.4 4.4-1"/>
        <path d="M9.9 10a3 3 0 0 0 4.2 4.2"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12c1.4-3.4 5-7 10-7s8.6 3.6 10 7c-1.4 3.4-5 7-10 7S3.4 15.4 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    }
  </button>
</div>
