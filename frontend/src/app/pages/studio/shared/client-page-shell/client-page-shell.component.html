<div class="client-app-shell">
  <app-client-portal-nav [activeSection]="activeSection" />

  <main class="shell-main">
    <section
      class="client-workspace"
      [style.--client-shell-max-width]="maxWidth"
      [attr.aria-labelledby]="titleId"
    >
      <header class="client-page-header">
        <div>
          @if (eyebrow) { <p class="eyebrow">{{ eyebrow }}</p> }
          <h1 [id]="titleId">{{ title }}</h1>
          @if (subtitle) { <p class="page-subtitle">{{ subtitle }}</p> }
        </div>
        <div class="page-actions">
          <ng-content select="[page-actions]"></ng-content>
        </div>
      </header>

      <ng-content></ng-content>
    </section>
  </main>
</div>
