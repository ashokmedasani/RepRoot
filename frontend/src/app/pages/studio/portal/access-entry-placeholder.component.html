<main class="access-shell">
  <a routerLink="/" class="back-link">Back</a>

  <header class="access-header">
    <p class="eyebrow">Access</p>
    <h1>Client Management</h1>
    <p>Choose the correct workspace to continue.</p>
  </header>

  <section class="entry-grid" aria-label="Client management access options">
    <a class="entry-card" routerLink="/professional/login" [class.entry-card--active]="selectedEntry === 'professional'" (click)="selectEntry('professional')">
      <span class="entry-card__icon">T</span>
      <strong>Professional</strong>
      <small>Login or create a global professional account.</small>
    </a>

    <a class="entry-card" routerLink="/client/login" [class.entry-card--active]="selectedEntry === 'client'" (click)="selectEntry('client')">
      <span class="entry-card__icon">C</span>
      <strong>Client Portal</strong>
      <small>Login with the username and password created by your professional.</small>
    </a>
  </section>
</main>
