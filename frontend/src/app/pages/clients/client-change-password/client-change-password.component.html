<main class="client-page">
  <header class="client-topbar">
    <a routerLink="/" class="brand">CoachFlow Studio</a>
    <a routerLink="/client/login" class="back-link">Back to Login</a>
  </header>

  @if (isLoggedIn) {
    <section class="password-card">
      <p class="eyebrow">Client Portal</p>
      <h1>Set a new password</h1>
      <p>Your trainer gave you a temporary password. Choose your own before entering the portal.</p>

      <form (ngSubmit)="changePassword()">
        <label>
          <span>Current (temporary) password</span>
          <input type="password" [(ngModel)]="passwordForm.currentPassword" name="currentPassword" autocomplete="current-password" required>
        </label>
        <label>
          <span>New password</span>
          <input type="password" [(ngModel)]="passwordForm.password" name="password" autocomplete="new-password" required>
          <small>At least 8 characters with 1 special character.</small>
        </label>
        <label>
          <span>Confirm new password</span>
          <input type="password" [(ngModel)]="passwordForm.confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        </label>

        <button type="submit" class="primary-action" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : 'Save New Password' }}
        </button>
      </form>

      @if (message) {
        <p class="form-message">{{ message }}</p>
      }
    </section>
  } @else {
    <section class="password-card">
      <p class="eyebrow">Client Portal</p>
      <h1>Please login to continue.</h1>
      <a routerLink="/client/login" class="primary-action">Client Login</a>
    </section>
  }
</main>
