<main class="auth-page">
  <header class="auth-topbar">
    <a routerLink="/portal" class="brand">CoachFlow Studio</a>
    <div class="top-action">
      <span>Trainer workspace?</span>
      <a routerLink="/trainer/login">Trainer login</a>
    </div>
  </header>

  <section class="auth-card" aria-labelledby="client-login-title">
    <p class="eyebrow">Client Portal</p>
    <h1 id="client-login-title">Login with your trainer-approved access</h1>

    <form class="auth-form" (ngSubmit)="verifyClientLogin()">
      <label>
        <span class="field-label">
          Trainer code <span class="required">*</span>
          <button type="button" class="picker-toggle" (click)="toggleDirectory()">
            {{ showDirectory ? 'Close' : 'Find by name' }}
          </button>
        </span>
        <input name="trainerCode" type="text" [(ngModel)]="loginForm.trainerCode" autocomplete="off" placeholder="Ask your trainer or find by name" required>

        @if (showDirectory) {
          <div class="trainer-picker">
            <input type="search" name="directorySearch" [(ngModel)]="directorySearch" placeholder="Search trainer name or code" autocomplete="off">
            <div class="picker-list">
              @if (isLoadingDirectory) {
                <p class="picker-empty">Loading trainers...</p>
              } @else {
                @for (trainer of filteredTrainers; track trainer.trainer_id) {
                  <button
                    type="button"
                    class="picker-item"
                    [class.selected]="loginForm.trainerCode === trainer.trainer_id"
                    (click)="selectTrainer(trainer)"
                  >
                    <span class="picker-name">{{ trainer.trainer_name }}</span>
                    <span class="picker-code">{{ trainer.trainer_id }}</span>
                  </button>
                } @empty {
                  <p class="picker-empty">No trainers match your search.</p>
                }
              }
            </div>
          </div>
        }
      </label>

      <label>
        <span class="field-label">Username <span class="required">*</span></span>
        <input name="clientUsername" type="text" [(ngModel)]="loginForm.username" autocomplete="username" required>
      </label>

      <label>
        <span class="field-label">Password <span class="required">*</span></span>
        <app-password-input name="clientPassword" [(ngModel)]="loginForm.password" autocomplete="current-password" [required]="true" />
      </label>

      <button type="submit" class="primary-action" [disabled]="isSubmitting">Continue</button>

      @if (loginMessage) {
        <p class="form-message">{{ loginMessage }}</p>
      }

      <p class="legal-note">
        By continuing, you agree to our
        <a routerLink="/terms" target="_blank" rel="noopener">Terms &amp; Conditions</a>
        and
        <a routerLink="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.
      </p>
    </form>
  </section>
</main>
