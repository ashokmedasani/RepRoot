<main class="client-page">
  <header class="client-topbar">
    <a routerLink="/" class="brand">
      <span class="brand-mark"><img src="/brand/reproot/mark.png" alt=""></span>
      <span>RepRoot</span>
    </a>
    <a routerLink="/client/login" class="back-link">Back to Login</a>
  </header>

  @if (isLoggedIn) {
    <section class="password-card">
      <p class="eyebrow">Client Portal</p>
      <h1>Set a new password</h1>
      <p>Choose a strong new password for your client portal.</p>

      <form (ngSubmit)="changePassword()">
        <label>
          <span>New password</span>
          <app-password-input [(ngModel)]="passwordForm.password" name="password" autocomplete="new-password" [required]="true" />
          <small>At least 8 characters with 1 special character.</small>
        </label>
        <label>
          <span>Confirm new password</span>
          <app-password-input [(ngModel)]="passwordForm.confirmPassword" name="confirmPassword" autocomplete="new-password" [required]="true" />
        </label>

        <button type="submit" class="primary-action" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : 'Save New Password' }}
        </button>
      </form>

      @if (message) {
        <p class="form-message">{{ message }}</p>
      }
    </section>
  } @else {
    <section class="password-card">
      <p class="eyebrow">Client Portal</p>
      <h1>Please login to continue.</h1>
      <a routerLink="/client/login" class="primary-action">Client Login</a>
    </section>
  }
</main>
