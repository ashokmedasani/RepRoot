@if (confirmation.request(); as request) {
  <div class="confirmation-backdrop" (click)="confirmation.cancel()">
    <section
      class="confirmation-panel"
      [class]="'confirmation-panel ' + request.kind"
      role="dialog"
      aria-modal="true"
      aria-labelledby="global-confirmation-title"
      (click)="$event.stopPropagation()"
    >
      <span class="action-icon" aria-hidden="true">
        @switch (request.kind) {
          @case ('delete') { &#128465; }
          @case ('approve') { &#10003; }
          @case ('send') { &#9993; }
          @case ('archive') { &#128230; }
          @case ('complete') { &#10003; }
          @default { ! }
        }
      </span>
      <div>
        <p class="action-label">Confirm action</p>
        <h2 id="global-confirmation-title">{{ request.title }} &lsquo;{{ request.target }}&rsquo;?</h2>
        <p class="impact">{{ request.impact }}</p>
      </div>
      <div class="confirmation-actions">
        <button type="button" class="cancel-action" (click)="confirmation.cancel()">Cancel</button>
        <button type="button" class="confirm-action" (click)="confirmation.accept()">{{ request.confirmLabel }}</button>
      </div>
    </section>
  </div>
}
