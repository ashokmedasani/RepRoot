<header class="site-header">
  <a class="brand" routerLink="/" (click)="selectSection('overview')" aria-label="RepRoot home">
    <span class="brand-mark"><img src="/brand/reproot/mark.png" alt=""></span>
    <span><b>Rep<span>Root</span></b></span>
  </a>
  <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="public-navigation"><span></span><span></span><span></span><span class="sr-only">Menu</span></button>
  <nav id="public-navigation" [class.open]="menuOpen" aria-label="RepRoot navigation">
    <a routerLink="/" [queryParams]="{ section: 'professionals' }" [class.active]="activeSection === 'professionals'" (click)="closeMenu()">Professionals</a>
    <a routerLink="/" [queryParams]="{ section: 'clients' }" [class.active]="activeSection === 'clients'" (click)="closeMenu()">Clients</a>
    <a routerLink="/pricing" [class.active]="activeSection === 'plans'" (click)="closeMenu()">Pricing</a>
    <app-theme-toggle label="Site appearance" />
    <a class="nav-cta" routerLink="/portal" (click)="closeMenu()">Launch RepRoot</a>
  </nav>
</header>
