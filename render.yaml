services:
  - type: web
    runtime: static
    name: reproot-web
    branch: Test
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/professional-management-platform/browser
    envVars:
      - key: RENDER_API_BASE_URL
        value: https://api.rep-root.com/api/accounts
      - key: SUPPORT_EMAIL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
